# =====================================================================
# Performance test defaults (committed, public).
# Lookup order per setting: -D system property > performance-local.properties
# (git-ignored) > this file. A value of <PROVIDED_BY_CI> counts as missing.
# Never put real credentials or tenant values in this file.
# =====================================================================

# --- Connection -------------------------------------------------------
tokenSubdomain=<PROVIDED_BY_CI>
clientId=<PROVIDED_BY_CI>
clientSecret=<PROVIDED_BY_CI>
apiSubdomain=<PROVIDED_BY_CI>
# {subdomain} is replaced with tokenSubdomain / apiSubdomain (added)
tokenUrlTemplate=https://{subdomain}.id.cyberark.cloud/oauth2/platformtoken
apiBaseUrlTemplate=https://{subdomain}.uap.cyberark.cloud/api
runEnvironment=local
# Proxy for all outgoing traffic, e.g. http://proxyhost:8080 ("none" = connect directly).
# CI passes the worker's HTTPS_PROXY / NO_PROXY here automatically.
httpsProxy=none
# Hosts reached directly, comma-separated like NO_PROXY (".example.com" = all subdomains; "none" = no exceptions)
noProxyHosts=none

# --- API shape --------------------------------------------------------
policyIdField=policyId
listItemsField=results
listNextTokenField=nextToken
listNextTokenParam=nextToken
listSearchParam=q
# Where list results hold each policy's ID and name (JSON pointers; confirmed on the tenant)
listItemIdPointer=/metadata/policyId
listItemNamePointer=/metadata/name
# Page size for unmeasured listings (seeding, sweep, cleanup) (added)
adminListPageSize=50
# Network timeout for unmeasured setup/cleanup requests (creates can be slow; not a pass/fail limit)
adminTimeoutMs=60000

# --- Token ------------------------------------------------------------
tokenRefreshRatio=0.8
# Wait before the single retry of a failed token refresh (added)
tokenRetryDelaySec=10

# --- Traffic and durations ---------------------------------------------
maxRps=10
normalRate=2
stressStartRate=1
stressStepIncrement=1
stressStepDurationMin=2
spikeRate=10
spikeDurationSec=60
spikeWarmupMin=3
spikeRecoveryMin=5
rampUpMin=2
loadDurationMin=15
isolatedLoadDurationMin=5
soakDurationMin=60

# --- Safety -----------------------------------------------------------
maxErrorPercent=5
# 30 s: creates average ~4 s and peak ~15 s with 5 in flight on the tenant (smoke runs, stage 5)
maxResponseTimeMs=30000
maxRateLimitResponses=5
safetyMinSamples=50
# Window for the "actual sent rate" in stop messages (added)
safetyRateWindowSec=30
# Spike: recovery p95 must be within this % of warm-up p95 (added)
spikeRecoveryTolerancePct=20
# Soak: p95 is logged once per window (added)
soakReportWindowMin=10

# --- Test data and runs -----------------------------------------------
namePrefix=automation_performance_test_
seedCount=100
seedRate=5
sweepMinAgeHours=24
concurrentRunWindowHours=7
allowConcurrentRuns=false
listMaxPages=3
policyTemplate=vm

# --- Principal: the pre-existing user the test policies grant access to ---
# These are the API spec's example values. Put the real ones in performance-local.properties.
principalId=ec513d58-fc64-4988-aef9-123456789012
principalName=tester@cyberark.cloud
principalType=User
principalSourceDirectoryName=CyberArk Cloud Directory
principalSourceDirectoryId=09B9A9B0-6CE8-465F-AB03-123456789012

# --- Mixed workload weights (percent of actions, must total 100) -------
mixListAllPct=25
mixListFilteredPct=20
mixGetPolicyPct=40
mixWritePct=15
